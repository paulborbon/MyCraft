<!doctype html>
<html lang="en">
<head>
  <!-- Document metadata and responsive viewport. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Paul Borbon - Technical Support Specialist portfolio">
  <title>Paul Borbon | Technical Support Specialist</title>
  <!-- Bootstrap provides the carousel, buttons, grid, and responsive utilities. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons provide the small icons used throughout the portfolio. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Shared portfolio styling. -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="profile">
  <!-- Decorative scanline layer for the optional sci-fi visual treatment. -->
  <div class="scanline"></div>

  <!-- Fixed application shell containing the shared sidebar and profile page. -->
  <div class="app-shell">
    <!-- Shared sidebar navigation. Every page uses the same navigation structure. -->
    <aside class="sidebar">
      <div class="brand-block">
        <div class="brand-mark">PB</div>
        <div><div class="brand-name">BORBON // OPS</div><div class="brand-sub">REMOTE TECH SUPPORT</div></div>
      </div>
      <div class="status"><span class="status-dot"></span> SYSTEM ONLINE</div>
      <!-- Sidebar links are normal page links so every tab has its own HTML file. -->
      <nav class="nav flex-column portfolio-nav" aria-label="Portfolio navigation">
        <a class="nav-link sound-button active" href="index.html">01 // PROFILE</a>
        <a class="nav-link sound-button" href="pages/experience.html">02 // EXPERIENCE</a>
        <a class="nav-link sound-button" href="pages/skills.html">03 // SKILLS</a>
        <a class="nav-link sound-button" href="pages/cases.html">04 // CASE STUDIES</a>
        <a class="nav-link sound-button" href="pages/powershell.html">05 // POWERSHELL</a>
        <a class="nav-link sound-button" href="pages/mock-ticket.html">06 // MOCK TICKET</a>
        <a class="nav-link sound-button" href="pages/virtual-assistant.html">07 // VIRTUAL ASSISTANT</a>
        <a class="nav-link sound-button" href="pages/certifications.html">08 // CERTIFICATIONS</a>
        <a class="nav-link sound-button" href="pages/contact.html">09 // CONTACT</a>
      </nav>
      <div class="sidebar-footer">v2.0 // PORTFOLIO BUILD</div>
    </aside>

    <!-- Main profile page. The other sections live in separate HTML files. -->
    <main class="main-panel">
      <!-- Top bar keeps the page title and theme toggle visible. -->
      <header class="topbar">
        <div><div class="topbar-title">MISSION PROFILE</div><div class="topbar-sub">CANVA PORTFOLIO SOURCE</div></div>
        <button id="themeToggle" class="btn btn-outline-primary theme-toggle sound-button" type="button" aria-label="Toggle light and dark mode"><i class="bi bi-sun-fill"></i> LIGHT</button>
      </header>

      <!-- Bootstrap carousel references the user's future local Canva PNG files. -->
      <section class="profile-stage">
        <div id="credentialCarousel" class="carousel slide" data-bs-ride="false" data-bs-interval="false">
          <!-- Carousel indicators correspond to the eight Canva pages. -->
          <div class="carousel-indicators">
            <button type="button" data-bs-target="#credentialCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Canva page 1"></button>
            <button type="button" data-bs-target="#credentialCarousel" data-bs-slide-to="1" aria-label="Canva page 2"></button>
            <button type="button" data-bs-target="#credentialCarousel" data-bs-slide-to="2" aria-label="Canva page 3"></button>
            <button type="button" data-bs-target="#credentialCarousel" data-bs-slide-to="3" aria-label="Canva page 4"></button>
            <button type="button" data-bs-target="#credentialCarousel" data-bs-slide-to="4" aria-label="Canva page 5"></button>
            <button type="button" data-bs-target="#credentialCarousel" data-bs-slide-to="5" aria-label="Canva page 6"></button>
            <button type="button" data-bs-target="#credentialCarousel" data-bs-slide-to="6" aria-label="Canva page 7"></button>
            <button type="button" data-bs-target="#credentialCarousel" data-bs-slide-to="7" aria-label="Canva page 8"></button>
          </div>

          <!-- Each carousel item points to a file you will place under assets/images. -->
          <div class="carousel-inner image-carousel-inner">
            <div class="carousel-item active"><img src="assets/images/canva page 1.png" class="d-block carousel-image" alt="Canva portfolio page 1"></div>
            <div class="carousel-item"><img src="assets/images/canva page 2.png" class="d-block carousel-image" alt="Canva portfolio page 2"></div>
            <div class="carousel-item"><img src="assets/images/canva page 3.png" class="d-block carousel-image" alt="Canva portfolio page 3"></div>
            <div class="carousel-item"><img src="assets/images/canva page 4.png" class="d-block carousel-image" alt="Canva portfolio page 4"></div>
            <div class="carousel-item"><img src="assets/images/canva page 5.png" class="d-block carousel-image" alt="Canva portfolio page 5"></div>
            <div class="carousel-item"><img src="assets/images/canva page 6.png" class="d-block carousel-image" alt="Canva portfolio page 6"></div>
            <div class="carousel-item"><img src="assets/images/canva page 7.png" class="d-block carousel-image" alt="Canva portfolio page 7"></div>
            <div class="carousel-item"><img src="assets/images/canva page 8.png" class="d-block carousel-image" alt="Canva portfolio page 8"></div>
          </div>

          <!-- Bootstrap previous/next controls. -->
          <button class="carousel-control-prev sound-button" type="button" data-bs-target="#credentialCarousel" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span><span class="visually-hidden">Previous</span></button>
          <button class="carousel-control-next sound-button" type="button" data-bs-target="#credentialCarousel" data-bs-slide="next"><span class="carousel-control-next-icon"></span><span class="visually-hidden">Next</span></button>
        </div>

        <!-- Small source note requested for the lower-right of the profile page. -->
        <div class="design-note">Designed in Canva</div>
      </section>
    </main>
  </div>

  <!-- Bootstrap JavaScript enables the carousel and responsive components. -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Shared JavaScript handles theme persistence and original UI sounds. -->
  <script src="js/script.js"></script>
</body>
</html>
